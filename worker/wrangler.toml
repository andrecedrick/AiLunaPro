name            = "ailunapro-worker"
main            = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Firebase project ID — used by auth middleware to validate token audience + issuer.
# Override per environment in [env.production] below.
FIREBASE_PROJECT_ID = "audit-ai-cc9e2"

# Comma-separated list of allowed CORS origins (local dev defaults).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"

# J15 P1.1 — R2 bucket for saved Audit Express PDFs (default/dev binding).
[[r2_buckets]]
binding = "AUDIT_PDFS"
bucket_name = "ailunapro-audit-pdfs"

# ── Environments ─────────────────────────────────────────────────────────────
# J2: production environment. Worker name preserved to reuse existing script
# (no new worker created). Custom domain api.ailunapro.com bound via Cloudflare
# Dashboard in Phase 4 (not via wrangler.toml routes to keep deploy idempotent).

[env.production]
name = "ailunapro-worker"

[env.production.vars]
FIREBASE_PROJECT_ID = "audit-ai-cc9e2"
ALLOWED_ORIGINS     = "https://audit.ailunapro.com"
APP_BASE_URL        = "https://audit.ailunapro.com"
APP_ENV             = "production"

# Phase 4 — plan-limit enforcement, SCOPED to a single test org (controlled rollout).
# ENABLE_PLAN_LIMITS_ORGS is the allowlist: with the flag on but this empty, NOBODY is
# enforced (fail-safe). Only the listed org(s) are enforced; "*" = explicit global.
# Rollback = remove these two lines + redeploy. ENABLE_RECOMMENDATION_CHARGE stays unset
# (OFF) so overflow is detected/blocked-for-Free but never billed for paid plans.
ENABLE_PLAN_LIMITS      = "true"
ENABLE_PLAN_LIMITS_ORGS = "org_ux6EH21A_1779743372219_71670faf"

[[env.production.r2_buckets]]
binding = "AUDIT_PDFS"
bucket_name = "ailunapro-audit-pdfs"