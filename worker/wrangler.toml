name            = "ailunapro-worker"
main            = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Firebase project ID — used by auth middleware to validate token audience + issuer.
# Override per environment in [env.production] below.
FIREBASE_PROJECT_ID = "audit-ai-cc9e2"

# Comma-separated list of allowed CORS origins (local dev defaults).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"

# J15 P1.1 — R2 bucket for saved Audit Express PDFs (default/dev binding).
[[r2_buckets]]
binding = "AUDIT_PDFS"
bucket_name = "ailunapro-audit-pdfs"

# ── Environments ─────────────────────────────────────────────────────────────
# J2: production environment. Worker name preserved to reuse existing script
# (no new worker created). Custom domain api.ailunapro.com bound via Cloudflare
# Dashboard in Phase 4 (not via wrangler.toml routes to keep deploy idempotent).

[env.production]
name = "ailunapro-worker"

[env.production.vars]
FIREBASE_PROJECT_ID = "audit-ai-cc9e2"
ALLOWED_ORIGINS     = "https://audit.ailunapro.com"
APP_BASE_URL        = "https://audit.ailunapro.com"
APP_ENV             = "production"

# Phase 5 — plan-limit enforcement, GLOBAL rollout ("*" = all organizations).
# ENABLE_PLAN_LIMITS_ORGS is the allowlist; "*" enforces every org (was a single test org
# in the scoped Phase-4 rollout). Within plan = free; over limit = enforced (Free → upgrade,
# no charge). ENABLE_RECOMMENDATION_CHARGE stays unset (OFF) → overflow is detected/blocked-
# for-Free but NEVER billed for paid plans (paid over-limit = overflow-free).
# Rollback to scoped: set ORGS back to the test orgId; full off: remove both lines. Redeploy.
ENABLE_PLAN_LIMITS      = "true"
ENABLE_PLAN_LIMITS_ORGS = "*"

# Phase 6 — SCOPED overflow BILLING: charge recommendation overflow for ONE test org only.
# recommendationChargeEnabledFor requires the flag AND this org in the allowlist (its OWN var —
# plan-limits "*" cannot leak in). This is a single orgId, NOT "*", so billing is SCOPED — NO
# global billing. The org is also enforced (ORGS="*"), so it's in enforced ∩ charge-allowlist.
# Overflow debits the token LEDGER (consumeTokens); Stripe stays TEST and only charges at pack
# purchase — overflow itself moves no money. Idempotent per overflow_{eventId}.
# Rollback: remove these 2 lines + `wrangler deploy --env production` → overflow returns overflow-free.
ENABLE_RECOMMENDATION_CHARGE      = "true"
ENABLE_RECOMMENDATION_CHARGE_ORGS = "org_ux6EH21A_1779743372219_71670faf"

[[env.production.r2_buckets]]
binding = "AUDIT_PDFS"
bucket_name = "ailunapro-audit-pdfs"