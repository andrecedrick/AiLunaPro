name            = "ailunapro-worker"
main            = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Firebase project ID — used by auth middleware to validate token audience + issuer.
# Override per environment in [env.production] below.
FIREBASE_PROJECT_ID = "audit-ai-cc9e2"

# Comma-separated list of allowed CORS origins (local dev defaults).
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"

# J15 P1.1 — R2 bucket for saved Audit Express PDFs (default/dev binding).
[[r2_buckets]]
binding = "AUDIT_PDFS"
bucket_name = "ailunapro-audit-pdfs"

# ── Environments ─────────────────────────────────────────────────────────────
# J2: production environment. Worker name preserved to reuse existing script
# (no new worker created). Custom domain api.ailunapro.com bound via Cloudflare
# Dashboard in Phase 4 (not via wrangler.toml routes to keep deploy idempotent).

[env.production]
name = "ailunapro-worker"

[env.production.vars]
FIREBASE_PROJECT_ID = "audit-ai-cc9e2"
ALLOWED_ORIGINS     = "https://audit.ailunapro.com"
APP_BASE_URL        = "https://audit.ailunapro.com"
APP_ENV             = "production"

# ── Billing SCOPE moved out of this deploy file ──────────────────────────────
# Plan-limit + overflow-charge scope (ENABLE_PLAN_LIMITS[_ORGS],
# ENABLE_RECOMMENDATION_CHARGE[_ORGS]) is NO LONGER set here. A business rule in a
# deploy artifact meant a worker rollback silently changed WHO gets billed.
# The authoritative source is now the Firestore doc `platform_config/billing`
# (see worker/src/lib/billing-config-store.ts): rollback-safe (survives worker
# version changes), version-independent, auditable. It self-seeds from the
# committed defaults (= the exact values previously here: plan-limits true/'*',
# recommendation-charge true/single-test-org) on first read, so their removal is
# behaviour-preserving. Change scope by editing that doc, not this file.

[[env.production.r2_buckets]]
binding = "AUDIT_PDFS"
bucket_name = "ailunapro-audit-pdfs"