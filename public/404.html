<!doctype html>
<!--
  Deploy-integrity guard: the presence of 404.html switches Cloudflare Pages
  from SPA-fallback mode to real-404 mode. Without it, a request for an asset
  from a PREVIOUS deployment (open tab navigating after a redeploy) was
  answered with 200 index.html AS JavaScript — which the browser then cached
  for a year under the asset URL (/assets/* is immutable). Real 404s make
  failed imports REJECT cleanly so the stale-bundle auto-recovery can run.
  The app itself uses hash routing (all routes live under /#/…), so no SPA
  path fallback is needed; humans only land here on a genuinely wrong URL.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — AiLunaPro</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             background: #F4F6FB; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #0F172A; }
      .card { max-width: 420px; width: 90%; background: #fff; border-radius: 14px; padding: 28px;
              box-shadow: 0 6px 24px rgba(0,0,0,0.10); text-align: center; }
      h1 { font-size: 20px; font-weight: 800; margin: 0 0 8px; }
      p { font-size: 14px; color: #334155; line-height: 1.55; margin: 0 0 16px; }
      a { display: inline-block; padding: 10px 22px; border-radius: 10px; background: #7C3AED;
          color: #fff; font-weight: 700; font-size: 14px; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Page not found</h1>
      <p>This address doesn't exist. The app lives at the link below.</p>
      <a href="/">Go to AiLunaPro</a>
    </div>
  </body>
</html>
