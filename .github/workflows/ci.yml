name: CI

# Gates every push and PR. The deploy job (below) is HARD-GATED on this job:
# a failing typecheck / build / test blocks production deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: typecheck · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (frontend)
        run: npm ci

      - name: Install (worker)
        working-directory: worker
        run: npm ci

      - name: Typecheck (frontend)
        run: npm run typecheck

      - name: Typecheck (worker)
        working-directory: worker
        run: npm run typecheck

      # Vite inlines VITE_* at BUILD time. Without them the bundle compiles and
      # deploys but cannot initialise Firebase, and every visitor is stuck on
      # "Still connecting…" — so vite.config.ts fails the build rather than
      # shipping such a bundle.
      #
      # The client config is held as ONE aggregate secret + ONE aggregate
      # variable, each a block of KEY=VALUE lines. GitHub does NOT expand an
      # aggregate into individual entries: `secrets.VITE_FIREBASE_API_KEY` is
      # simply empty when only `AILUNAPRO_API_KEY_SECRET` exists. They are
      # therefore parsed into $GITHUB_ENV here.
      #
      # Only VITE_* keys are accepted, so a stray line in the blob cannot inject
      # arbitrary environment into the job. Secret values are registered with
      # ::add-mask:: so they cannot surface in a later log line. The layer
      # variables are deliberately NOT masked — redacting the literal word
      # "firebase" everywhere would make the log unreadable for no benefit.
      - name: Load client env
        env:
          CLIENT_SECRETS: ${{ secrets.AILUNAPRO_API_KEY_SECRET }}
          CLIENT_VARS: ${{ vars.AILUNAPRO_DB_VARIABLE }}
        run: |
          set -uo pipefail
          load_env() {
            local blob="$1" mode="$2" line key value
            while IFS= read -r line; do
              line="${line%$'\r'}"
              if [ -z "$line" ]; then continue; fi
              case "$line" in
                \#*)      continue ;;
                VITE_*=*) ;;
                *)        continue ;;
              esac
              key="${line%%=*}"
              value="${line#*=}"
              if [ "$mode" = mask ] && [ ${#value} -ge 8 ]; then
                echo "::add-mask::$value"
              fi
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            done <<< "$blob"
          }
          load_env "$CLIENT_SECRETS" mask
          load_env "$CLIENT_VARS" plain
          echo "loaded $(grep -c '^VITE_' "$GITHUB_ENV") client variables"

      - name: Build (tsc gate + vite)
        run: npm run build

      - name: Test
        run: npm run test -- --run

  deploy:
    name: deploy (production)
    needs: gate                                   # HARD GATE — no deploy unless gate passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (frontend)
        run: npm ci

      - name: Install (worker)
        working-directory: worker
        run: npm ci

      # $GITHUB_ENV does not cross jobs, so the client config is loaded again
      # here. This is the build that actually SHIPS.
      - name: Load client env
        env:
          CLIENT_SECRETS: ${{ secrets.AILUNAPRO_API_KEY_SECRET }}
          CLIENT_VARS: ${{ vars.AILUNAPRO_DB_VARIABLE }}
        run: |
          set -uo pipefail
          load_env() {
            local blob="$1" mode="$2" line key value
            while IFS= read -r line; do
              line="${line%$'\r'}"
              if [ -z "$line" ]; then continue; fi
              case "$line" in
                \#*)      continue ;;
                VITE_*=*) ;;
                *)        continue ;;
              esac
              key="${line%%=*}"
              value="${line#*=}"
              if [ "$mode" = mask ] && [ ${#value} -ge 8 ]; then
                echo "::add-mask::$value"
              fi
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            done <<< "$blob"
          }
          load_env "$CLIENT_SECRETS" mask
          load_env "$CLIENT_VARS" plain
          echo "loaded $(grep -c '^VITE_' "$GITHUB_ENV") client variables"

      # Rebuild in the deploy job so the deployed dist is exactly what the gate
      # verified.
      - name: Build
        run: npm run build

      - name: Deploy worker
        working-directory: worker
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy pages
        run: npx wrangler pages deploy dist --project-name=ailunapro-app --branch=ailunapro-app --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
