<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Resource hints (P3-a) — warm up critical first-paint / first-data origins.
      Hints only: no behavior change, no new requests. preconnect opens DNS+TCP+TLS
      early; dns-prefetch is the cheaper fallback. crossorigin is set on the CORS
      origins (fonts + our API + Firestore) so the warmed socket matches the
      anonymous CORS fetch. (preconnect has no wildcard, so *.googleapis.com is
      expanded to the boot-critical Firebase hosts.)
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.ailunapro.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.ailunapro.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com" />
    <!-- Google Fonts (P3-b): loaded here (not via CSS @import) so it's discovered
         during initial HTML parse and fetched in parallel with the bundle.
         display=swap → text paints immediately in fallback, then swaps (no FOIT). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dhtnegf9d/image/upload/v1777320369/5_f5i6ym.png" />
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dhtnegf9d/image/upload/v1777320369/5_f5i6ym.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The authenticated SPA app shell is private and hash-routed (every app view is
      served from this index.html). Keep it OUT of search indexes. Public, indexable
      surfaces (e.g. /audit-express) are separate static pages under public/ that do
      NOT carry this directive. (Phase 2 — SEO/GEO boundaries.)
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="AI Luna Pro — AI compliance audit & governance dashboard." />
    <title>AI Luna Pro — Compliance Dashboard</title>
    <script>
      // Apply theme before paint to avoid flash of light theme.
      (function () {
        try {
          var stored = localStorage.getItem('ailunapro-theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <script>
      // Self-heal a stale-deploy chunk mismatch: if a static/preloaded app
      // chunk (/assets/*.js|css) or a dynamic import fails to load, the served
      // index.html is referencing asset hashes that no longer exist. index.html
      // is no-cache, so a SINGLE hard reload re-resolves to the current hashes
      // and the app boots. Guarded by sessionStorage to prevent reload loops; if
      // it still fails after one reload, the boot watchdog shows the card.
      (function () {
        var KEY = 'ailunapro-chunk-recover';
        function recoverOnce() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
            window.location.reload();
          } catch (e) { /* ignore */ }
        }
        // Version-aware recovery: when an asset fails, ask the server which
        // build it currently has (/version.json, emitted every build) and
        // compare with the build id stamped into THIS document's meta tag.
        // Mismatch ⇒ this HTML/bundle is stale ⇒ reload converges (fresh
        // index.html is no-cache), guarded per upgrade-pair against loops.
        // Match or fetch failure ⇒ fall back to the once-per-session reload.
        function recoverSmart() {
          var meta = document.querySelector('meta[name="ailunapro-build"]');
          var mine = meta && meta.getAttribute('content');
          if (!mine || !window.fetch) { recoverOnce(); return; }
          fetch('/version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (j) {
              var server = j && typeof j.buildId === 'string' ? j.buildId : null;
              if (server && server !== mine) {
                var pair = mine + '->' + server;
                try {
                  if (sessionStorage.getItem('ailunapro-stale-reload') === pair) return;
                  sessionStorage.setItem('ailunapro-stale-reload', pair);
                } catch (e) { /* ignore */ }
                window.location.reload();
              } else {
                recoverOnce();
              }
            })
            .catch(function () { recoverOnce(); });
        }
        // IMPORTANT: preventDefault() makes the failed import RESOLVE WITH
        // UNDEFINED (Vite contract) — only safe when we immediately reload.
        // recoverSmart() decides asynchronously, so we never preventDefault
        // here: the import REJECTS (lazyWithRetry/ErrorBoundary handle the UI)
        // while the version check runs in parallel and reloads if stale.
        window.addEventListener('vite:preloadError', function () { recoverSmart(); });
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (!t || !t.tagName) return;
          var tag = String(t.tagName).toUpperCase();
          var url = (t.src || t.href || '') + '';
          if ((tag === 'SCRIPT' || tag === 'LINK') && url.indexOf('/assets/') !== -1) recoverSmart();
        }, true);
        // Clear the guard after a confirmed successful boot so a FUTURE deploy
        // mismatch can self-heal again.
        window.addEventListener('load', function () {
          window.setTimeout(function () {
            if (window.__APP_BOOTED__) { try { sessionStorage.removeItem(KEY); } catch (e) {} }
          }, 3000);
        });
      })();
    </script>
    <style>
      /* Boot loader — literal colors (no dependency on the bundled CSS), so a
         spinner is visible even if the JS/CSS chunks are slow or blocked. Shown
         in #root before React mounts and reused by the in-app loading state. */
      .app-boot-loader {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #F4F6FB;
      }
      [data-theme="dark"] .app-boot-loader { background: #0B0E14; }
      .app-boot-spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(124, 58, 237, 0.25); border-top-color: #7C3AED;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-label="Loading">
        <div class="app-boot-spinner"></div>
      </div>
    </div>
    <script>
      // Bundle-independent boot watchdog. If React has not signaled usable UI
      // (window.__APP_INTERACTIVE__) within the timeout — e.g. the JS bundle is
      // blocked by an ad-blocker / privacy extension / corporate filter or a
      // chunk 404s — replace the spinner with an actionable card. This is the
      // ONLY escape when React never mounts (the in-app watchdog can't run).
      // If React boots later, it re-renders #root and reclaims the UI.
      (function () {
        var BOOT_TIMEOUT_MS = 15000;
        window.setTimeout(function () {
          // Only fire when the JS bundle never executed (blocked / 404 / fatal
          // parse error). If it executed (__APP_BOOTED__), React owns the UI and
          // its in-app card handles "loaded but can't connect" — this avoids a
          // false-positive on a legitimately slow 3G download.
          if (window.__APP_INTERACTIVE__ || window.__APP_BOOTED__) return;
          // P0 — self-heal FIRST: the most common cause of "bundle never executed" is a
          // stale cached index.html referencing a purged hashed asset after a deploy.
          // One automatic reload (session-guarded) fetches fresh HTML + assets and
          // recovers without the user ever seeing the card. If the reload attempt
          // already happened (or storage is blocked), fall through to the card.
          try {
            if (!sessionStorage.getItem('__boot_retry__')) {
              sessionStorage.setItem('__boot_retry__', '1');
              window.location.reload();
              return;
            }
          } catch (e) { /* storage blocked → show the card */ }
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#F4F6FB;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">' +
              '<div style="max-width:460px;width:100%;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.10);padding:24px;text-align:center;color:#0F172A">' +
                '<h1 style="font-size:18px;font-weight:800;margin:0 0 8px">Still connecting&hellip;</h1>' +
                '<p style="font-size:13px;color:#64748B;line-height:1.55;margin:0 0 16px">This is taking longer than expected. A slow network, an ad-blocker / privacy extension, or a corporate filter may be blocking <strong>audit.ailunapro.com</strong> or <strong>*.googleapis.com</strong>. The app will continue automatically once it connects.</p>' +
                '<button onclick="window.location.reload()" style="width:100%;padding:10px 16px;border-radius:10px;border:none;background:#7C3AED;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Reload</button>' +
                '<a href="/#/help?section=troubleshooting" style="display:block;margin-top:8px;padding:10px 16px;border-radius:10px;border:1px solid #CBD5E1;color:#334155;font-weight:600;font-size:14px;text-decoration:none">Troubleshooting help</a>' +
              '</div>' +
            '</div>';
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
