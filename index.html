<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dhtnegf9d/image/upload/v1777320369/5_f5i6ym.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The authenticated SPA app shell is private and hash-routed (every app view is
      served from this index.html). Keep it OUT of search indexes. Public, indexable
      surfaces (e.g. /audit-express) are separate static pages under public/ that do
      NOT carry this directive. (Phase 2 — SEO/GEO boundaries.)
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="AI Luna Pro — AI compliance audit & governance dashboard." />
    <title>AI Luna Pro — Compliance Dashboard</title>
    <script>
      // Apply theme before paint to avoid flash of light theme.
      (function () {
        try {
          var stored = localStorage.getItem('ailunapro-theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <style>
      /* Boot loader — literal colors (no dependency on the bundled CSS), so a
         spinner is visible even if the JS/CSS chunks are slow or blocked. Shown
         in #root before React mounts and reused by the in-app loading state. */
      .app-boot-loader {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; background: #F4F6FB;
      }
      [data-theme="dark"] .app-boot-loader { background: #0B0E14; }
      .app-boot-spinner {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(124, 58, 237, 0.25); border-top-color: #7C3AED;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-label="Loading">
        <div class="app-boot-spinner"></div>
      </div>
    </div>
    <script>
      // Bundle-independent boot watchdog. If React has not signaled usable UI
      // (window.__APP_INTERACTIVE__) within the timeout — e.g. the JS bundle is
      // blocked by an ad-blocker / privacy extension / corporate filter or a
      // chunk 404s — replace the spinner with an actionable card. This is the
      // ONLY escape when React never mounts (the in-app watchdog can't run).
      // If React boots later, it re-renders #root and reclaims the UI.
      (function () {
        var BOOT_TIMEOUT_MS = 15000;
        window.setTimeout(function () {
          // Only fire when the JS bundle never executed (blocked / 404 / fatal
          // parse error). If it executed (__APP_BOOTED__), React owns the UI and
          // its in-app card handles "loaded but can't connect" — this avoids a
          // false-positive on a legitimately slow 3G download.
          if (window.__APP_INTERACTIVE__ || window.__APP_BOOTED__) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#F4F6FB;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">' +
              '<div style="max-width:460px;width:100%;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.10);padding:24px;text-align:center;color:#0F172A">' +
                '<h1 style="font-size:18px;font-weight:800;margin:0 0 8px">Still connecting&hellip;</h1>' +
                '<p style="font-size:13px;color:#64748B;line-height:1.55;margin:0 0 16px">This is taking longer than expected. A slow network, an ad-blocker / privacy extension, or a corporate filter may be blocking <strong>audit.ailunapro.com</strong> or <strong>*.googleapis.com</strong>. The app will continue automatically once it connects.</p>' +
                '<button onclick="window.location.reload()" style="width:100%;padding:10px 16px;border-radius:10px;border:none;background:#7C3AED;color:#fff;font-weight:700;font-size:14px;cursor:pointer">Reload</button>' +
                '<a href="/#/help?section=troubleshooting" style="display:block;margin-top:8px;padding:10px 16px;border-radius:10px;border:1px solid #CBD5E1;color:#334155;font-weight:600;font-size:14px;text-decoration:none">Troubleshooting help</a>' +
              '</div>' +
            '</div>';
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
